<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/css/styles.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="module">
      import StoriiiesViewer from "/src/StoriiiesViewer.ts";
      document.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector("#viewer");
        // e.g. /?manifest=multiple-images-v3 to load another fixture
        const manifest =
          new URLSearchParams(location.search).get("manifest") ||
          "standard-v3";

        window.storiiiesViewerInstance = new StoriiiesViewer({
          container,
          manifestUrl: `http://localhost:43110/manifests/${manifest}/manifest.json`,
        });
      });
    </script>
    <title>Demo</title>
  </head>
  <body>
    <div id="viewer"></div>
  </body>
</html>
